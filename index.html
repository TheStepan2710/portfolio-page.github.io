<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stepan Tribunskii — Product Designer</title>
    <meta
      name="description"
      content="Product Designer portfolio — web and mobile interfaces from research and user flows to development-ready UI."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header" id="top">
      <div class="container header-inner">
        <a href="#top" class="logo">Stepan Tribunskii</a>
        <button class="menu-toggle" aria-expanded="false" aria-controls="nav-panel">Menu</button>
        <nav class="nav" id="nav-panel" aria-label="Main navigation">
          <ul class="nav-list" id="nav-list"></ul>
          <div class="header-actions">
            <button class="lang-switch" id="lang-switch" aria-label="Language switch">
              <span data-lang="ru">RU</span>
              <span class="divider">|</span>
              <span data-lang="en">EN</span>
            </button>
            <a id="telegram-link" class="btn btn-ghost" target="_blank" rel="noreferrer">Telegram</a>
            <a id="linkedin-link" class="btn btn-ghost" target="_blank" rel="noreferrer">LinkedIn</a>
            <a id="resume-link" class="btn btn-solid" target="_blank" rel="noreferrer">Resume</a>
          </div>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero reveal" id="hero">
        <div class="container hero-layout">
          <div class="hero-content">
            <p class="eyebrow" id="hero-eyebrow"></p>
            <h1 id="hero-title"></h1>
            <p class="hero-text" id="hero-text"></p>
            <div class="hero-cta-row">
              <a href="#work" class="btn btn-solid" id="hero-primary-cta"></a>
              <a class="btn btn-ghost" id="hero-secondary-cta" target="_blank" rel="noreferrer"></a>
            </div>
            <p class="hero-status" id="hero-status"></p>
          </div>
          <div class="hero-visual-wrap">
            <img src="assets/images/placeholders/hero-placeholder.svg" alt="Abstract portfolio visual" class="hero-visual" />
          </div>
        </div>
      </section>

      <section class="quick-proof reveal" id="quick-proof">
        <div class="container section-shell compact">
          <h2 id="quick-proof-title"></h2>
          <div class="chip-grid" id="quick-proof-items"></div>
        </div>
      </section>

      <section class="selected-work reveal" id="work">
        <div class="container section-shell">
          <div class="section-heading">
            <h2 id="work-title"></h2>
            <p id="work-intro"></p>
          </div>
          <div class="project-grid" id="work-cards"></div>
        </div>
      </section>

      <section class="experience reveal" id="experience">
        <div class="container section-shell">
          <div class="section-heading compact-text">
            <h2 id="experience-title"></h2>
            <p id="experience-intro"></p>
          </div>
          <div class="experience-grid" id="experience-items"></div>
        </div>
      </section>

      <section class="pet-projects reveal" id="pet-projects">
        <div class="container section-shell">
          <div class="section-heading compact-text">
            <h2 id="pet-title"></h2>
            <p id="pet-intro"></p>
          </div>
          <div class="pet-grid" id="pet-cards"></div>
        </div>
      </section>

      <section class="about reveal" id="about">
        <div class="container section-shell compact-text">
          <h2 id="about-title"></h2>
          <p class="about-text" id="about-text"></p>
        </div>
      </section>

      <section class="contact reveal" id="contact">
        <div class="container section-shell final-cta">
          <h2 id="contact-title"></h2>
          <p id="contact-text"></p>
          <div class="final-actions">
            <a id="contact-telegram" class="btn btn-solid" target="_blank" rel="noreferrer"></a>
            <a id="contact-linkedin" class="btn btn-ghost" target="_blank" rel="noreferrer"></a>
            <a id="contact-resume" class="btn btn-ghost" target="_blank" rel="noreferrer"></a>
          </div>
        </div>
      </section>
    </main>

    <script src="data/content.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
